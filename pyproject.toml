[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autourgos-preiteration"
version = "3.0.9"
description = "Pre-iteration middleware for Autourgos agents — run callbacks and inject files before each agent iteration."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    {name = "Jitin Kumar Sengar", email = "devxjitin@gmail.com"}
]
maintainers = [
    {name = "Sonia"},
    {name = "Vishwanil Suman"},
]
keywords = ["autourgos", "agent", "middleware", "screenshot", "vision", "iteration", "callback"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["autourgos-agent>=3.1.0", "autourgos-core>=0.3.0"]

[project.optional-dependencies]
images = ["Pillow>=9.0"]

[project.urls]
Homepage = "https://github.com/devxjitin/autourgos-preiteration"
Repository = "https://github.com/devxjitin/autourgos-preiteration"
Issues = "https://github.com/devxjitin/autourgos-preiteration/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["autourgos_preiteration*"]

[tool.setuptools.package-data]
autourgos_preiteration = ["py.typed"]
